<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — OS Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --asphalt: #15130F; --asphalt-2: #1E1B15; --asphalt-3: #26221A;
    --chrome: #D8DADE; --chrome-dim: #8A8D93; --white: #F7F5F0;
    --amber: #D4A537; --crimson: #C43B3B; --line: #2E2A21;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--asphalt); color:var(--chrome); font-family:'Inter', sans-serif; min-height:100vh; }
  .wrap{ max-width:900px; margin:0 auto; padding:60px 24px 100px; }
  .brand{
    font-family:'Oswald', sans-serif; font-weight:700; letter-spacing:0.04em;
    color:var(--white); font-size:19px; text-transform:uppercase; text-align:center; margin-bottom:8px;
  }
  .brand span{ color:var(--amber); }
  .sub{ text-align:center; color:var(--chrome-dim); font-size:14px; margin-bottom:44px; }

  #loginState, #appState{ display:none; }
  #loginState.active, #appState.active{ display:block; }

  .login-box{ text-align:center; padding:48px 24px; border:1px solid var(--line); border-radius:10px; background:var(--asphalt-2); }
  .btn{
    display:inline-block; background:var(--amber); color:var(--asphalt); border:none;
    padding:13px 26px; border-radius:5px; font-weight:600; font-size:14px; cursor:pointer;
    font-family:'Inter', sans-serif; transition:background .2s ease;
  }
  .btn:hover{ background:#E3B84A; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-danger{ background:var(--crimson); color:var(--white); }
  .btn-danger:hover{ background:#D9534F; }
  .btn-secondary{ background:var(--asphalt-3); color:var(--chrome); border:1px solid var(--line); }
  .btn-secondary:hover{ background:var(--asphalt-2); }
  .btn-small{ padding:6px 12px; font-size:12px; }

  .card{ border:1px solid var(--line); border-radius:10px; background:var(--asphalt-2); padding:28px; margin-bottom:20px; max-width:560px; margin-left:auto; margin-right:auto; }
  .user-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:13px; color:var(--chrome-dim); max-width:560px; margin-left:auto; margin-right:auto; }
  .user-row button{ background:none; border:none; color:var(--crimson); font-family:'Inter', sans-serif; cursor:pointer; font-size:13px; }

  label{ display:block; font-size:13px; font-weight:600; color:var(--white); margin-bottom:6px; margin-top:18px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=date]{
    width:100%; background:var(--asphalt-3); border:1px solid var(--line); border-radius:5px;
    padding:11px 12px; color:var(--white); font-family:'Inter', sans-serif; font-size:14px;
  }
  input[type=file]{
    width:100%; background:var(--asphalt-3); border:1px dashed var(--line); border-radius:5px;
    padding:20px 12px; color:var(--chrome-dim); font-family:'Inter', sans-serif; font-size:13px;
  }
  .submit-row{ margin-top:26px; }
  .submit-row .btn{ width:100%; }

  .status{ margin-top:16px; font-size:13px; font-family:'JetBrains Mono', monospace; }
  .status.ok{ color:var(--amber); }
  .status.err{ color:var(--crimson); }
  .status.working{ color:var(--chrome-dim); }

  .preview-strip{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .preview-strip img{ width:64px; height:64px; object-fit:cover; border-radius:4px; border:1px solid var(--line); }

  .manage-section{ margin-top:60px; }
  .manage-section h2{
    font-family:'Oswald', sans-serif; text-transform:uppercase; color:var(--white);
    font-size:22px; margin-bottom:20px; text-align:center;
  }

  /* Grid view */
  .shoots-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:18px;
  }
  .shoot-tile{
    position:relative; border:1px solid var(--line); border-radius:8px; background:var(--asphalt-2);
    overflow:hidden; cursor:pointer; transition:transform .2s ease;
  }
  .shoot-tile:hover{ transform:translateY(-3px); }
  .shoot-tile-cover{ aspect-ratio:4/3; background:var(--asphalt-3); overflow:hidden; }
  .shoot-tile-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .shoot-tile-meta{ padding:12px 14px 14px; }
  .shoot-tile-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; color:var(--white); text-transform:uppercase; }
  .shoot-tile-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--chrome-dim); margin-top:4px; }
  .edit-icon{
    position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%;
    background:rgba(21,19,15,0.85); border:1px solid var(--line); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }

  /* Edit view */
  #editView{ display:none; }
  #editView.active{ display:block; }
  .edit-back{
    font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--chrome-dim);
    cursor:pointer; margin-bottom:20px; display:inline-block;
  }
  .edit-back:hover{ color:var(--amber); }

  .edit-photo-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .edit-photo-row{
    display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:6px;
    padding:8px; background:var(--asphalt-3);
  }
  .edit-photo-row img{ width:60px; height:60px; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .edit-photo-controls{ display:flex; flex-direction:column; gap:4px; }
  .edit-photo-controls button{
    background:var(--asphalt-2); border:1px solid var(--line); color:var(--chrome);
    width:26px; height:22px; cursor:pointer; border-radius:3px; font-size:11px;
  }
  .edit-photo-labels{ display:flex; gap:14px; align-items:center; font-size:12px; color:var(--chrome-dim); flex:1; }
  .edit-photo-labels label{ display:flex; align-items:center; gap:5px; margin:0; font-weight:400; font-size:12px; color:var(--chrome-dim); }

  .edit-actions{ display:flex; gap:10px; margin-top:26px; }
  .edit-actions .btn{ flex:1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">OS <span>MEDIA</span></div>
  <div class="sub">Shoot manager</div>

  <div id="loginState">
    <div class="login-box">
      <p style="margin-top:0;color:var(--chrome-dim);font-size:14px;">Log in to add a new shoot to the site.</p>
      <button class="btn" onclick="netlifyIdentity.open('login')">Log in</button>
    </div>
  </div>

  <div id="appState">
    <div class="user-row">
      <span id="userEmail"></span>
      <button onclick="netlifyIdentity.logout()">Log out</button>
    </div>

    <div class="card">
      <label for="shootTitle">Shoot name</label>
      <input type="text" id="shootTitle" placeholder="e.g. Rockingham Car Meet">

      <label for="shootDate">Date</label>
      <input type="date" id="shootDate">

      <label for="shootPhotos">Photos</label>
      <input type="file" id="shootPhotos" accept="image/*" multiple>
      <div class="preview-strip" id="previewStrip"></div>

      <div class="submit-row">
        <button class="btn" id="submitBtn" onclick="submitShoot()">Add shoot</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="manage-section" id="gridView">
      <h2>Manage Shoots</h2>
      <div id="shootsGrid" class="shoots-grid"></div>
    </div>

    <div class="manage-section" id="editView">
      <span class="edit-back" onclick="closeEditShoot()">&larr; Back to all shoots</span>

      <div class="card">
        <label for="editTitle">Shoot name</label>
        <input type="text" id="editTitle">

        <label for="editDate">Date</label>
        <input type="date" id="editDate">

        <label>Photos (use arrows to reorder, radio to set cover, checkbox for homepage)</label>
        <div class="edit-photo-list" id="editPhotoList"></div>
<label for="editAddPhotos">Add more photos</label>
<input type="file" id="editAddPhotos" accept="image/*" multiple>
<button class="btn btn-secondary btn-small" style="margin-top:10px;" onclick="addPhotosToShoot()">Upload selected photos</button>
<div class="status" id="editAddStatus"></div>

        <div class="edit-actions">
          <button class="btn" id="editSaveBtn" onclick="saveEditedShoot()">Save changes</button>
          <button class="btn btn-danger" onclick="deleteCurrentShoot()">Delete shoot</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let allShoots = [];
  let editingShootId = null;

  netlifyIdentity.on('init', user => {
    updateUI(user);
  });
  netlifyIdentity.on('login', user => {
    updateUI(user);
  });
  netlifyIdentity.on('logout', () => {
    updateUI(null);
  });
  netlifyIdentity.init();

  async function getAuthHeader() {
    const user = netlifyIdentity.currentUser();
    const token = await user.jwt();
    return { 'Authorization': 'Bearer ' + token };
  }

  async function loadShoots() {
    const res = await fetch('/.netlify/functions/shoots-list?t=' + Date.now());
    const data = await res.json();
    allShoots = data.shoots;
    renderShootsGrid();
  }

  function renderShootsGrid() {
    const grid = document.getElementById('shootsGrid');
    if (!allShoots.length) {
      grid.innerHTML = '<p>No shoots yet.</p>';
      return;
    }
    grid.innerHTML = allShoots.map(shoot => `
      <div class="shoot-tile" onclick="openEditShoot('${shoot.id}')">
        <div class="edit-icon">&#9998;</div>
        <div class="shoot-tile-cover"><img src="${shoot.coverPhoto ? '/.netlify/functions/photo?key=' + encodeURIComponent(shoot.coverPhoto) : shoot.photos[0]}" alt="${shoot.title}"></div>
        <div class="shoot-tile-meta">
          <div class="shoot-tile-title">${shoot.title}</div>
          <div class="shoot-tile-date">${shoot.date} &middot; ${shoot.photos.length} photo${shoot.photos.length === 1 ? '' : 's'}</div>
        </div>
      </div>
    `).join('');
  }

  function openEditShoot(id) {
    const shoot = allShoots.find(s => s.id === id);
    if (!shoot) return;
    editingShootId = id;

    document.getElementById('editTitle').value = shoot.title;
    document.getElementById('editDate').value = shoot.date;
    renderEditPhotoList(shoot);

    document.getElementById('gridView').style.display = 'none';
    document.getElementById('editView').classList.add('active');
    window.scrollTo(0,0);
  }

  function closeEditShoot() {
    editingShootId = null;
    document.getElementById('editView').classList.remove('active');
    document.getElementById('gridView').style.display = 'block';
    loadShoots();
  }

  function renderEditPhotoList(shoot) {
    const list = document.getElementById('editPhotoList');
    list.innerHTML = shoot.photoKeys.map((key, i) => `
      <div class="edit-photo-row">
        <div class="edit-photo-controls">
          <button onclick="movePhoto(${i}, -1)" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
          <button onclick="movePhoto(${i}, 1)" ${i === shoot.photoKeys.length - 1 ? 'disabled' : ''}>&darr;</button>
        </div>
        <img src="/.netlify/functions/photo?key=${encodeURIComponent(key)}" />
        <div class="edit-photo-labels">
          <label>
            <input type="radio" name="editCover" ${key === shoot.coverPhoto ? 'checked' : ''} onclick="setEditCover('${key}')" />
            Cover
          </label>
          <label>
            <input type="checkbox" ${(shoot.featuredPhotos || []).includes(key) ? 'checked' : ''} onclick="toggleEditFeatured('${key}', this.checked)" />
            Homepage
          </label>
        </div>
        <button class="btn btn-danger btn-small" onclick="deletePhotoFromEdit('${key}')">Delete</button>
      </div>
    `).join('');
  }

  function movePhoto(index, direction) {
    const shoot = allShoots.find(s => s.id === editingShootId);
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= shoot.photoKeys.length) return;
    const temp = shoot.photoKeys[index];
    shoot.photoKeys[index] = shoot.photoKeys[newIndex];
    shoot.photoKeys[newIndex] = temp;
    renderEditPhotoList(shoot);
  }

  function setEditCover(key) {
    const shoot = allShoots.find(s => s.id === editingShootId);
    shoot.coverPhoto = key;
  }

  function toggleEditFeatured(key, isChecked) {
    const shoot = allShoots.find(s => s.id === editingShootId);
    if (!shoot.featuredPhotos) shoot.featuredPhotos = [];
    if (isChecked) {
      shoot.featuredPhotos.push(key);
    } else {
      shoot.featuredPhotos = shoot.featuredPhotos.filter(k => k !== key);
    }
  }

  async function deletePhotoFromEdit(key) {
    if (!confirm('Delete this photo? This cannot be undone.')) return;
    const headers = await getAuthHeader();
    const res = await fetch('/.netlify/functions/shoots-update', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ shootId: editingShootId, deletePhotoKey: key })
    });
    const data = await res.json();
    const shootIndex = allShoots.findIndex(s => s.id === editingShootId);
    allShoots[shootIndex] = data.shoot;
    renderEditPhotoList(data.shoot);
  }
async function addPhotosToShoot() {
  const files = document.getElementById('editAddPhotos').files;
  const statusEl = document.getElementById('editAddStatus');

  if (files.length === 0) {
    statusEl.textContent = 'Pick at least one photo first.';
    statusEl.className = 'status err';
    return;
  }

  statusEl.className = 'status working';

  try {
    const newPhotos = [];
    for (let i = 0; i < files.length; i++) {
      statusEl.textContent = `Processing photo ${i+1} of ${files.length}...`;
      newPhotos.push(await resizeImage(files[i]));
    }

    statusEl.textContent = 'Uploading...';
    const headers = await getAuthHeader();
    const res = await fetch('/.netlify/functions/shoots-add-photos', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ shootId: editingShootId, photos: newPhotos })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || ('Server returned ' + res.status));
    }

    const data = await res.json();
    const shootIndex = allShoots.findIndex(s => s.id === editingShootId);
    allShoots[shootIndex] = data.shoot;
    renderEditPhotoList(data.shoot);

    statusEl.textContent = 'Photos added!';
    statusEl.className = 'status ok';
    document.getElementById('editAddPhotos').value = '';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Something went wrong: ' + err.message;
    statusEl.className = 'status err';
  }
}

  async function saveEditedShoot() {
    const btn = document.getElementById('editSaveBtn');
    const shoot = allShoots.find(s => s.id === editingShootId);
    const title = document.getElementById('editTitle').value.trim();
    const date = document.getElementById('editDate').value;

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const headers = await getAuthHeader();
      const res = await fetch('/.netlify/functions/shoots-update', {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          shootId: editingShootId,
          title,
          date,
          coverPhoto: shoot.coverPhoto,
          featuredPhotos: shoot.featuredPhotos,
          photoKeys: shoot.photoKeys
        })
      });

      if (res.ok) {
        btn.textContent = '✓ Saved!';
        btn.style.background = '#4CAF50';
      } else {
        btn.textContent = '✗ Failed - try again';
        btn.style.background = '#C43B3B';
      }
    } catch (e) {
      console.error('Save failed:', e);
      btn.textContent = '✗ Failed - try again';
      btn.style.background = '#C43B3B';
    }

    setTimeout(() => { btn.textContent = 'Save changes'; btn.style.background = ''; btn.disabled = false; }, 1500);
  }

  async function deleteCurrentShoot() {
    if (!confirm('Delete this entire shoot permanently? This cannot be undone.')) return;
    const headers = await getAuthHeader();
    await fetch('/.netlify/functions/shoots-delete', {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ shootId: editingShootId })
    });
    closeEditShoot();
  }

  netlifyIdentity.on('login', () => loadShoots());
  netlifyIdentity.on('init', user => { if (user) loadShoots(); });

  function updateUI(user){
    if(user){
      document.getElementById('loginState').classList.remove('active');
      document.getElementById('appState').classList.add('active');
      document.getElementById('userEmail').textContent = 'Logged in as ' + user.email;
    } else {
      document.getElementById('loginState').classList.add('active');
      document.getElementById('appState').classList.remove('active');
    }
  }

  document.getElementById('shootDate').valueAsDate = new Date();

  document.getElementById('shootPhotos').addEventListener('change', (e) => {
    const strip = document.getElementById('previewStrip');
    strip.innerHTML = '';
    [...e.target.files].forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      strip.appendChild(img);
    });
  });

  function resizeImage(file, maxWidth = 2000, quality = 0.85){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function submitShoot(){
  const title = document.getElementById('shootTitle').value.trim();
  const date = document.getElementById('shootDate').value;
  const files = document.getElementById('shootPhotos').files;
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  if(!title){ statusEl.textContent = 'Give the shoot a name first.'; statusEl.className = 'status err'; return; }
  if(files.length === 0){ statusEl.textContent = 'Pick at least one photo.'; statusEl.className = 'status err'; return; }

  submitBtn.disabled = true;
  statusEl.className = 'status working';

 try{
  const allPhotos = [];
  for(let i = 0; i < files.length; i++){
    statusEl.textContent = `Processing photo ${i+1} of ${files.length}...`;
    allPhotos.push(await resizeImage(files[i]));
  }

  const user = netlifyIdentity.currentUser();
  const token = await user.jwt();

  statusEl.textContent = `Uploading photo 1 of ${allPhotos.length}...`;
  const res = await fetch('/.netlify/functions/shoots-add', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ title, date, photos: [allPhotos[0]] })
  });

  if(!res.ok){
    const errText = await res.text();
    throw new Error(errText || ('Server returned ' + res.status));
  }

  const data = await res.json();
  const shootId = data.shootId;

  for(let i = 1; i < allPhotos.length; i++){
    statusEl.textContent = `Uploading photo ${i+1} of ${allPhotos.length}...`;

    const photoRes = await fetch('/.netlify/functions/shoots-add-photos', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ shootId, photos: [allPhotos[i]] })
    });

    if(!photoRes.ok){
      const errText = await photoRes.text();
      throw new Error(`Photo ${i+1} failed: ` + (errText || ('Server returned ' + photoRes.status)));
    }
  }

  statusEl.textContent = 'Shoot added! View it below.';
  statusEl.className = 'status ok';
  document.getElementById('shootTitle').value = '';
  document.getElementById('shootPhotos').value = '';
  document.getElementById('previewStrip').innerHTML = '';
  loadShoots();
}catch(err){
  console.error(err);
  statusEl.textContent = 'Something went wrong: ' + err.message;
  statusEl.className = 'status err';
}finally{
  submitBtn.disabled = false;
}

</script>
</body>
</html>
